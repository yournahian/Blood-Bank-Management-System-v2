<!DOCTYPE html>
<html>
<head>
    <title>Break-Even Point Analysis Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .chart-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 800px;
            height: 500px;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <canvas id="bepChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('bepChart').getContext('2d');
        const bepChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Year 0', 'Year 1', 'Year 2', 'Year 3'],
                datasets: [
                    {
                        label: 'Cumulative Cost (Millions BDT)',
                        data: [5.68, 6.68, 7.68, 8.68],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 3,
                        pointRadius: 6,
                        fill: false
                    },
                    {
                        label: 'Cumulative Benefit (Millions BDT)',
                        data: [0, 1.5, 4.5, 9.0],
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderWidth: 3,
                        pointRadius: 6,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Break-Even Point Analysis',
                        font: {
                            size: 20
                        }
                    },
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                size: 14
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Millions (BDT)',
                            font: {
                                size: 14
                            }
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Timeline',
                            font: {
                                size: 14
                            }
                        }
                    }
                }
            }
        });
    </script>

</body>
</html>
